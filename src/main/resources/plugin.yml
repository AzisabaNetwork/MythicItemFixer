name: MythicItemFixer
version: '${version}'
main: net.azisaba.mythicitemFixer.MythicItemFixer
api-version: '1.21.11'
softdepend: [MythicMobs, StorageBox]
authors: [ AzisabaNetwork ]
website: https://github.com/AzisabaNetwork/MythicItemFixer
description: Keeps MythicMobs 4.12 item IDs working on 1.21.11 / MythicMobs 5.
commands:
  mmidfix:
    description: MythicItemFixer migration commands
    usage: /mmidfix [check|hand|help|status|reload|scan|offline|worldscan]
permissions:
  mythicitemfixer.use:
    description: /mmidfix, check, hand, help (repair your own items)
    default: true
  mythicitemfixer.admin:
    description: /mmidfix status, reload, scan, offline, worldscan
    default: op
    children:
      mythicitemfixer.use: true
